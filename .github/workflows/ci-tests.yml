# Every test suite in this repository, on every push and every pull request.
#
# WHY THIS FILE EXISTS
# --------------------
# Three times in one day a whole test file vanished from a run without anyone noticing.
# A test file that fails to *load* - one bad import, one renamed symbol - is reported by
# both pytest and `node --test` as a single error, while every assertion inside it silently
# stops running. The output looks like one ordinary failure. It is not: it is a hundred
# assertions that are no longer being made.
#
# The Node suites made this worse by not being in CI at all. They ran only where somebody
# had happened to install that directory's dependencies, so a broken file could sit unnoticed
# indefinitely. They run here now.
#
# So this workflow does not only check that tests pass. It checks that the NUMBER of tests
# that ran has not dropped. That is the assertion the vanishing-file failure mode needs,
# because a file that fails to load lowers the count without failing anything.
#
# TWO MOBILE SUITES ARE A FUNCTION OF THE *PYTHON* DIFF (2026-10-11)
# ------------------------------------------------------------------
# This is not obvious and it cost a red merge. Two files under
# book-tracker-mobile-stitch/__tests__ read BACKEND source directly:
#
#   notificationEvents.test.mjs  greps app/notifications/config.py
#   apiContract.test.mjs         greps app/routers/*.py
#
# So a package that touches only Python can turn a MOBILE suite red - which is precisely the
# case where nobody thinks to run one. Sprint 4I-A added a `content_reported` event with no
# matching mobile entry; both API Builders were green on pytest, the merged tree sat red on
# notificationEvents, and it was only found when a mobile Builder measured its own baseline.
#
# The gate worked. Nobody was running it. If you change app/notifications/config.py or
# app/routers/*.py, run the Android suite too, or let this workflow be the thing that tells
# you - but then do not merge before it has.
#
# THE PINNED COUNTS BELOW ARE A FLOOR, TO BE RAISED AND NEVER LOWERED.
# They are the numbers measured on the branch that added this file. Adding tests means
# raising the floor in the same commit. If a number here ever needs to go DOWN, that is
# either tests being deleted - which needs saying out loud in the commit message and in the
# review - or a file that stopped loading, which is the bug this file is here to catch.
# Lowering a floor to make CI green is the exact move this workflow exists to prevent.
#
# RAISE THESE EVERY SPRINT. Not "when you remember": a floor that lags is a gate that is
# switched off, and the size of the hole is exactly the size of the lag. Measured 2026-09-29:
# the pytest floor said 623 while master passed 709, so a test file could have stopped
# loading and taken 86 assertions with it without CI saying a word - for a week. The last
# step of any sprint that touches tests is to re-measure all three suites and put the
# numbers here, in that sprint's own commit.
#
# Public repositories get unlimited GitHub-hosted Actions minutes, so running all three
# suites on every push costs nothing.
#
# No secrets. No DATABASE_URL. The pytest suite runs entirely on in-memory SQLite
# (tests/conftest.py), and the Node suites read source files. Nothing here touches a
# production service.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest tests
    runs-on: ubuntu-latest
    env:
      # Floor, not a target. Raise it when you add tests; never lower it to go green.
      # 2026-09-29: this had drifted. It was set to 623 when P5 added this file, and master
      # reached 709 as Sprint 4E and the rest of 4F merged without anyone raising it — an
      # 86-test hole in the exact protection this workflow exists to give. Package P6
      # measured 714 locally and set the floor to it. If CI reports fewer than 714, that is
      # the gap this floor exists to expose; find the file that stopped loading rather than
      # lowering the number.
      # 2026-10-11, merge of Sprint 4G into master. Master carried 728 (715 + 13 from the
      # book-search query tests); Sprint 4G added 72 on a 715 base, so the merged tree is
      # measured below rather than computed. RAISE THIS EVERY SPRINT - it drifted 86 tests
      # behind in a week once, which defeats the gate entirely.
      # 2026-10-11, Sprint 4H (the Apple revocation fix): re-measured at 814 on branch
      # sprint-4h-apple-revocation - 800 + 14 new ids in tests/test_apple_auth.py
      # (B-50, B-51 x4, B-52..B-60). No existing id was removed; five were edited in place.
      # 2026-10-11, Sprint 4I-A (the report API): re-measured at 855 on branch
      # builder-4i-report - 814 + 40 in the new tests/test_reports.py + 1 in
      # tests/test_sql_artifacts.py (S-23). No existing id was removed; three were edited in
      # place (the deny_bot_actor inventory 4 -> 5, and two literals in test_apple_auth.py
      # that an appended schema_guard pair and one new GET route move). 4I-B raises this
      # again. The number is off a run, never typed out of a plan - this floor drifted 86
      # tests behind once.
      # 2026-10-11, Sprint 4I-B (the block API): re-measured at 952 on branch
      # builder-4i-block - 855 + 84 in the new tests/test_blocks.py + 13 in the new
      # tests/test_route_coverage.py. No existing id was removed; three were edited in place
      # (the deny_bot_actor inventory 5 -> 6, and two literals in test_apple_auth.py that an
      # appended schema_guard pair and one new GET route move). The 24 re-measured budget
      # numbers change no id and no count.
      EXPECTED_MIN_TESTS: 952
    steps:
      - uses: actions/checkout@v4
        with:
          # B-23' (tests/test_bots.py::TestExistingSuite) diffs against a PINNED pre-Sprint-4F
          # commit, 707b8d9. A pinned SHA is not present in the default depth-1 clone, so the
          # three B-23' cases would fail with "the pinned base is not reachable". Full history
          # is the fix; re-pointing the rule at origin/master is NOT — read the comment on
          # B23_BASE before touching either. Do not lower this to a fixed depth either: the
          # distance from HEAD to 707b8d9 grows with every commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Not in requirements.txt, which is the runtime list: the test suite needs these.
          pip install pytest pyyaml

      - name: Run the suite and check the count has not dropped
        run: |
          set -uo pipefail
          # The suite's own exit code is kept, but it must not abort the step: the count
          # check below is the more informative of the two and has to get a chance to run.
          python -m pytest tests -q 2>&1 | tee pytest.log
          STATUS=${PIPESTATUS[0]}
          PASSED="$(grep -oE '[0-9]+ passed' pytest.log | tail -1 | cut -d' ' -f1)"
          if [ -z "$PASSED" ]; then
            echo "::error::Could not read a passed-count from the pytest output."
            exit 1
          fi
          echo "pytest passed: $PASSED (floor: $EXPECTED_MIN_TESTS), pytest exit $STATUS"
          if [ "$PASSED" -lt "$EXPECTED_MIN_TESTS" ]; then
            echo "::error::Only $PASSED tests passed; the floor is $EXPECTED_MIN_TESTS."
            echo "::error::A drop usually means a test file failed to LOAD - its assertions"
            echo "::error::disappeared and the run reported one error instead of many."
            exit 1
          fi
          exit "$STATUS"

  node-qa:
    name: node --test qa/unit
    runs-on: ubuntu-latest
    env:
      # Floor, not a target. See the header.
      # 2026-10-11, Sprint 4I P4 (report and block on the web): re-measured at 48 on branch
      # builder-4i-web - 38 + 10 in the new qa/unit/reportAffordance.test.mjs (C-01, C-03,
      # C-04, C-05, C-06, C-10, C-12, C-13, C-14, C-16). No existing id was removed and no
      # existing qa/unit file was edited. The number is off a run, never typed out of a plan.
      EXPECTED_MIN_TESTS: 48
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install qa dependencies
        run: npm ci --prefix qa

      - name: Run the suite and check the count has not dropped
        run: |
          set -uo pipefail
          # `node --test` exits non-zero on a failure; that must not abort the step before
          # the count check, which is the one that catches a file that failed to load.
          node --test "qa/unit/*.test.mjs" 2>&1 | tee node-qa.log
          PASS="$(grep -oE '^# pass [0-9]+' node-qa.log | tail -1 | awk '{print $3}')"
          FAIL="$(grep -oE '^# fail [0-9]+' node-qa.log | tail -1 | awk '{print $3}')"
          if [ -z "$PASS" ] || [ -z "$FAIL" ]; then
            echo "::error::Could not read the test counts from the node --test output."
            exit 1
          fi
          echo "qa/unit pass: $PASS fail: $FAIL (floor: $EXPECTED_MIN_TESTS)"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::$FAIL qa/unit test(s) failed."
            exit 1
          fi
          if [ "$PASS" -lt "$EXPECTED_MIN_TESTS" ]; then
            echo "::error::Only $PASS qa/unit tests passed; the floor is $EXPECTED_MIN_TESTS."
            echo "::error::A drop usually means a test file failed to LOAD."
            exit 1
          fi

  node-android:
    name: node --test book-tracker-mobile-stitch/__tests__
    runs-on: ubuntu-latest
    env:
      # Floor, not a target. See the header.
      # 2026-10-07, Sprint 4G P4: re-measured at 136 on branch builder-4g-client2
      # (121 + 15: appleSignIn.test.mjs's A-01..A-13, two of which are A-02a/A-02b).
      # tests.md predicted 134 for 13 cases; A-02b (iOS is Apple-only, pm-decisions
      # E-6) and A-13 (the eas.json ios profiles, addendum K-10) are additions this
      # package had to make and are written up in build-notes-4g-client.md.
      # 2026-10-11, master: the iPad responsive-layout sweep added A-15 and A-16.
      # 2026-10-11, Sprint 4H: re-measured at 139 on branch sprint-4h-apple-revocation.
      # The floor still said 136 while master already passed 138 - a two-test hole that had
      # drifted in since 4G's P4. 138 is master's measured count; +1 is A-14, the case that
      # asserts the authorization code travels from the credential into the request body.
      # Merged: both sides independently set 139; the merged tree is measured below.
      # 2026-10-11, Sprint 4I P5 (report and block in the app): re-measured at 152 on
      # branch builder-4i-mobile - 140 + 12 in the new
      # book-tracker-mobile-stitch/__tests__/reportAffordance.test.mjs. tests.md §1
      # predicted 149 for 9 cases; the extra three are
      #   * unfollow_sits_above_block_in_the_profile_menu - pm-decisions E-1's ordering
      #     decision had no other proof;
      #   * every_new_4i_string_is_in_all_six_locales - i18nParity catches a key that is
      #     in one locale and not another, but not a key that is in none of them;
      #   * the_version_is_bumped_for_the_one_release_that_carries_both_halves - there is
      #     no OTA channel, and release/last-released.json is a Play record that does not
      #     know iOS already shipped build 5.
      # One existing case was edited in place: appleSignIn.test.mjs's 4G file-ownership
      # rule gained a named, bounded Sprint 4I file list (see the comment there). No test
      # id was removed. The merged tree ALSO had one pre-existing RED that this package
      # fixes: notificationEvents.test.mjs went red when 4I-A added the content_reported
      # backend event without the mobile EVENT_CONFIG entry, so the measured "before" is
      # 140 collected / 139 passed.
      # 2026-10-12, Sprint 4J: re-measured at 153 on master - 152 + 1 in sourceRules.test.mjs
      # (the_tab_bar_height_and_padding_are_safe_area_aware). The number is off a run.
      EXPECTED_MIN_TESTS: 153
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: book-tracker-mobile-stitch
        run: npm ci

      - name: Run the suite and check the count has not dropped
        working-directory: book-tracker-mobile-stitch
        run: |
          set -uo pipefail
          # Same reason as the qa/unit job: keep the step alive long enough to compare counts.
          node --test "__tests__/*.test.mjs" 2>&1 | tee node-android.log
          PASS="$(grep -oE '^# pass [0-9]+' node-android.log | tail -1 | awk '{print $3}')"
          FAIL="$(grep -oE '^# fail [0-9]+' node-android.log | tail -1 | awk '{print $3}')"
          if [ -z "$PASS" ] || [ -z "$FAIL" ]; then
            echo "::error::Could not read the test counts from the node --test output."
            exit 1
          fi
          echo "__tests__ pass: $PASS fail: $FAIL (floor: $EXPECTED_MIN_TESTS)"
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::$FAIL Android test(s) failed."
            exit 1
          fi
          if [ "$PASS" -lt "$EXPECTED_MIN_TESTS" ]; then
            echo "::error::Only $PASS Android tests passed; the floor is $EXPECTED_MIN_TESTS."
            echo "::error::A drop usually means a test file failed to LOAD."
            exit 1
          fi
