name: Build Stitch AAB (Production)

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: book-tracker-mobile-stitch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # EAS CLI (latest) requires Node >= 22: the 2026-09-21 build failed on 20
          cache: 'npm'
          cache-dependency-path: book-tracker-mobile-stitch/package-lock.json

      - name: Check version bump
        run: node scripts/check-version-bump.js --strict

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Inject build info
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > src/buildInfo.js << EOF
          // Auto-generated at build time by GitHub Actions.
          export const BUILD_NUMBER = '${{ github.run_number }}';
          export const BUILD_DATE = '${BUILD_DATE}';
          EOF

      - name: Build Android AAB
        run: eas build --platform android --profile production --local --output ./build.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackMyRead-stitch-production
          path: book-tracker-mobile-stitch/build.aab
          retention-days: 14
